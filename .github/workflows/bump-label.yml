# bump-label.yml -- the `bump label` check. See docs/ci-pipeline.md.

name: Bump label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The release bot dispatches this on release/next after every rebuild, because
  # events created with GITHUB_TOKEN start no runs.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: bump-label-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && format('labels-{0}', github.event.pull_request.number) || format('refs-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

jobs:
  bump-label:
    name: bump label
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      REPO_OWNER: ${{ github.repository_owner }}
      HEAD_REF: ${{ github.head_ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Require exactly one bump label on release/next
        shell: bash
        run: |
          if [ "$HEAD_REF" != "release/next" ]; then
            echo "Head branch '$HEAD_REF' is not release/next: no bump label required."
            exit 0
          fi
          number="$PR_NUMBER"
          if [ -z "$number" ]; then
            code=0; number=$(gh api "repos/${GH_REPO}/pulls?state=open&head=${REPO_OWNER}:${HEAD_REF}" --jq '.[].number' 2>&1) || code=$?
            if [ "$code" -ne 0 ]; then
              echo "::error::could not list the pull requests of release/next (exit $code): $number"
              exit 1
            fi
            if [ -z "$number" ]; then
              echo "::error::release/next has no open pull request, so its bump label cannot be checked"
              exit 1
            fi
            case "$number" in
              *$'\n'*)
                echo "::error::release/next has more than one open pull request"
                exit 1
                ;;
            esac
          fi
          code=0; names=$(gh api "repos/${GH_REPO}/pulls/${number}" --jq '.labels[].name' 2>&1) || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::could not read the labels of pull request #${number} (exit $code): $names"
            exit 1
          fi
          count=0; selected=""
          while IFS= read -r name; do
            case "$name" in
              bump:*)
                count=$((count + 1))
                selected="${selected} ${name}"
                ;;
            esac
          done <<< "$names"
          if [ "$count" -ne 1 ]; then
            echo "::error::pull request #${number} from release/next must carry exactly one bump:* label, found ${count}:${selected}"
            exit 1
          fi
          echo "Pull request #${number} carries exactly one bump label:${selected}"
