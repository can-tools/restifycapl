# release.yml -- release of the two DLLs. The mode follows the ref: a tag ref
# (pushed or dispatched) publishes, a branch ref is a dry run that never does.
# See docs/release-process.md.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Full history: the ancestor check needs origin/main.
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Select mode
        id: mode
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then mode=tag; else mode=dry-run; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Validate the tag
        id: tag
        if: steps.mode.outputs.mode == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::tag '$TAG' is not of the form vX.Y.Z without leading zeros"
            exit 1
          fi
          for field in "${BASH_REMATCH[@]:1}"; do
            if [ "${#field}" -gt 5 ] || [ "$field" -gt 65535 ]; then
              echo "::error::tag '$TAG' has a field above 65535 (version resource fields are 16-bit)"
              exit 1
            fi
          done

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not an ancestor of origin/main"
            exit 1
          fi

          # The CHANGELOG section is found through the first parent, as "^" does for a merge commit.
          read -r -a ids <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if [ "${#ids[@]}" -lt 2 ]; then
            echo "::error::the tagged commit has no parent; tag the squash-merge commit of the CHANGELOG cut"
            exit 1
          fi

          # A draft is not returned by the tags endpoint, only a published release is.
          if err=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1 >/dev/null); then
            echo "::error::a published release for $TAG already exists; never move a published tag"
            exit 1
          elif [[ "$err" != *"HTTP 404"* ]]; then
            echo "::error::could not check for an existing release: $err"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Run the CHANGELOG fixtures
        shell: bash
        run: pwsh -NoProfile -File scripts/ci/changelog.ps1 fixtures -FixtureDir tests/changelog

      - name: Extract the CHANGELOG section for the release notes
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: pwsh -NoProfile -File scripts/ci/changelog.ps1 notes -Mode "$MODE" -Sha "$GITHUB_SHA" -Output "$RUNNER_TEMP/notes-body.md"

      - name: Show the version
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # bash runs with -e: capture next-version's status on the same line or the step ends early.
          set -euo pipefail
          if [ "$MODE" = "tag" ]; then
            printf "%s\n\n" "Version $TAG_VERSION, taken from the tag." >> "$GITHUB_STEP_SUMMARY"
          else
            code=0
            next=$(pwsh -NoProfile -File scripts/ci/changelog.ps1 next-version) || code=$?
            if [ "$code" -eq 0 ]; then
              printf "%s\n\n" "Next version computed from [Unreleased], with no bump label: $next. A dry run publishes nothing." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$code" -eq 1 ]; then
              reason=$(printf '%s\n' "$next" | sed 's/^::error:://')
              printf "%s\n\n" "No next version can be computed from [Unreleased]: $reason" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::next-version failed with exit code $code"
              printf "%s\n\n" "next-version failed with exit code $code; see the log of this step." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit 0

      - name: Upload the notes body
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes-body
          path: ${{ runner.temp }}/notes-body.md
          if-no-files-found: error
          overwrite: true

  pipeline-x86:
    needs: validate
    uses: ./.github/workflows/arch-pipeline.yml
    with:
      arch: x86
      release-version: ${{ needs.validate.outputs.version }}

  pipeline-x64:
    needs: validate
    uses: ./.github/workflows/arch-pipeline.yml
    with:
      arch: x64
      release-version: ${{ needs.validate.outputs.version }}

  export-table:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check the export table
        id: table
        uses: ./.github/actions/export-table

      - name: Upload the export table markdown
        if: ${{ !cancelled() && steps.table.outputs.markdown-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: export-table-markdown
          path: ${{ steps.table.outputs.markdown-path }}
          if-no-files-found: error
          overwrite: true

  assemble:
    needs: [validate, pipeline-x86, pipeline-x64, export-table]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download restifycapl-x86.dll
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: restifycapl-x86
          path: dist

      - name: Download restifycapl-x64.dll
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: restifycapl-x64
          path: dist

      - name: Download the notes body
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: release-notes-body
          path: parts/body

      - name: Download the export table markdown
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: export-table-markdown
          path: parts/table

      - name: Write SHA256SUMS and the release notes
        shell: bash
        run: |
          set -euo pipefail
          ls -1 dist
          shopt -s nullglob
          dist_files=(dist/*)
          [ "$(printf '%s\n' "${dist_files[@]#dist/}" | sort | tr '\n' ' ')" = "restifycapl-x64.dll restifycapl-x86.dll " ] || {
            echo "::error::dist must contain exactly the two DLLs"
            exit 1
          }
          (cd dist && sha256sum restifycapl-x86.dll restifycapl-x64.dll > SHA256SUMS)

          rows=$(grep -cE '^\| [0-9]+ \| ' parts/table/export-table.md || true)
          if [ "$rows" -lt 1 ]; then
            echo "::error::the export table markdown has no function rows"
            exit 1
          fi

          {
            cat parts/body/notes-body.md
            printf '\n### Using this release\n\n'
            cat <<'EOF'
          Take `capl/` from this tag's source archive; a DLL and `capl/` from different versions fail at CAPL compile.

          Check a download: in PowerShell, `Get-FileHash restifycapl-x64.dll` must print the hash listed for that file in `SHA256SUMS` (likewise `restifycapl-x86.dll`).

          Both DLLs carry a GitHub build-provenance attestation, which the release workflow verifies before publishing; to verify it yourself, see `docs/release-process.md` in the source archive.
          EOF
            printf '\n### Export table\n\n<details>\n<summary>%s functions</summary>\n\n' "$rows"
            cat parts/table/export-table.md
            printf '\n</details>\n'
          } > dist/notes.md

          count_chars=$(cat <<'PS'
          $t = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("dist/notes.md")); $t.Length - [regex]::Matches($t, "[\uD800-\uDBFF][\uDC00-\uDFFF]").Count
          PS
          )
          chars=$(pwsh -NoProfile -Command "$count_chars")
          if [ "$chars" -gt 125000 ]; then
            echo "::error::release notes are $chars characters, the limit is 125000"
            exit 1
          fi

          {
            echo '### SHA256SUMS'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo '### notes.md'
            echo
            cat dist/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          overwrite: true

  attest:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: release-assets
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/restifycapl-x86.dll
            dist/restifycapl-x64.dll

      - name: Verify the attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for dll in restifycapl-x86.dll restifycapl-x64.dll; do
            verified=0
            for _ in 1 2 3; do
              if gh attestation verify "dist/$dll" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
                verified=1
                break
              fi
              sleep 10
            done
            if [ "$verified" -ne 1 ]; then
              echo "::error::attestation of $dll could not be verified"
              exit 1
            fi
          done

  publish:
    needs: [validate, export-table, assemble, attest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: release-assets
          path: dist

      - name: Require that no published release exists for the tag
        shell: bash
        run: |
          set -euo pipefail
          if err=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1 >/dev/null); then
            echo "::error::a published release for $TAG already exists; never move a published tag"
            exit 1
          elif [[ "$err" != *"HTTP 404"* ]]; then
            echo "::error::could not check for an existing release: $err"
            exit 1
          fi

      - name: Delete a leftover draft for the tag
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            | jq -r --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag) | .id' \
            | while read -r id; do
                echo "deleting leftover draft $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              done

      - name: Create the draft release and upload the assets
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes-file dist/notes.md \
            dist/restifycapl-x86.dll dist/restifycapl-x64.dll dist/SHA256SUMS

      - name: Verify the draft
        shell: bash
        run: |
          set -euo pipefail
          draft=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" \
            | jq -c --arg tag "$TAG" '[.[][] | select(.draft and .tag_name == $tag)]')
          if [ "$(echo "$draft" | jq 'length')" -ne 1 ]; then
            echo "::error::expected exactly one draft for $TAG"
            exit 1
          fi

          names=$(echo "$draft" | jq -r '.[0].assets | map(.name) | sort | join(" ")')
          if [ "$names" != "SHA256SUMS restifycapl-x64.dll restifycapl-x86.dll" ]; then
            echo "::error::the draft must carry exactly three assets, found: $names"
            exit 1
          fi

          chars=$(echo "$draft" | jq '.[0].body | length')
          if [ "$chars" -gt 125000 ]; then
            echo "::error::the draft notes are $chars characters, the limit is 125000"
            exit 1
          fi

          mkdir verify
          echo "$draft" | jq -r '.[0].assets[] | "\(.id) \(.name)"' | while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "verify/$name"
          done
          (cd verify && sha256sum -c SHA256SUMS)

      - name: Make the release public
        shell: bash
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Say what state the release is in
        if: failure()
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > /dev/null 2>&1; then
            msg="The release for $TAG is public. Never move the tag; fix forward with a new version and mark this release as withdrawn."
          else
            msg="Nothing is public for $TAG. Re-run the failed jobs for a transient failure, or delete the draft and the tag, fix, and tag again."
          fi
          echo "::error::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
