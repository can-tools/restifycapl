# ci.yml -- CI for restifycapl (CAPL REST DLL). One build + test pipeline per
# architecture (arch-pipeline.yml), each with a gate job. See
# docs/ci-pipeline.md for CI-only trap/cache rationale.

name: CI

# Branch filter avoids racing the release workflow's (release.yml) tag push -- see
# docs/ci-pipeline.md. Keep in sync with auto-pr.yml's branch filter and
# the stage-branch skill's naming convention.
on:
  push:
    branches: [main, "feat/**", "stage/**", "chore/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]
  # A dispatch runs the gates on any ref, so automation can get the required checks for a branch no push filter covers.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-x86:
    uses: ./.github/workflows/arch-pipeline.yml
    with:
      arch: x86

  pipeline-x64:
    uses: ./.github/workflows/arch-pipeline.yml
    with:
      arch: x64

  # if: always() runs the gate even when its pipeline failed or was skipped;
  # a skipped required check counts as passing, so the gate must fail
  # explicitly on anything but success. See docs/ci-pipeline.md.
  gate-x86:
    name: build + test (x86)
    needs: pipeline-x86
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful pipeline
        shell: bash
        env:
          PIPELINE_RESULT: ${{ needs.pipeline-x86.result }}
        run: |
          if [ "$PIPELINE_RESULT" != "success" ]; then
            echo "::error::pipeline-x86 finished with result '$PIPELINE_RESULT', expected 'success'"
            exit 1
          fi

  gate-x64:
    name: build + test (x64)
    needs: pipeline-x64
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful pipeline
        shell: bash
        env:
          PIPELINE_RESULT: ${{ needs.pipeline-x64.result }}
        run: |
          if [ "$PIPELINE_RESULT" != "success" ]; then
            echo "::error::pipeline-x64 finished with result '$PIPELINE_RESULT', expected 'success'"
            exit 1
          fi

  # Not a gate and not a required check: no gate waits for it. See
  # docs/ci-pipeline.md.
  export-table:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/export-table

  # Not a gate and not a required check: no gate waits for it. See the
  # changelog-fixtures section of docs/ci-pipeline.md.
  changelog-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the CHANGELOG fixtures
        shell: bash
        run: pwsh -NoProfile -File scripts/ci/changelog.ps1 fixtures -FixtureDir tests/changelog

  # Never make this a required check: it is skipped on a dispatch, and a skipped
  # required check counts as passing. See docs/ci-pipeline.md.
  actionlint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download actionlint and verify its SHA-256
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          code=0; out=$(curl --fail --silent --show-error --location --output "$archive" "$url" 2>&1) || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::actionlint download failed (exit $code): $out"
            exit 1
          fi
          code=0; out=$(echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check 2>&1) || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::actionlint archive does not match the pinned SHA-256: $out"
            exit 1
          fi
          code=0; out=$(tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint 2>&1) || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::actionlint extraction failed (exit $code): $out"
            exit 1
          fi
      - name: Lint the workflows
        shell: bash
        run: |
          code=0; out=$("$RUNNER_TEMP/actionlint" -color) || code=$?
          echo "$out"
          exit "$code"
