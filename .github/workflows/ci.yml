# ci.yml -- CI for restifycapl (CAPL REST DLL). One build + test pipeline per
# architecture (arch-pipeline.yml), each with a gate job. See
# docs/ci-pipeline.md for CI-only trap/cache rationale.

name: CI

# Branch filter avoids racing a future release.yml tag push -- see
# docs/ci-pipeline.md. Keep in sync with auto-pr.yml's branch filter and
# the stage-branch skill's naming convention.
on:
  push:
    branches: [main, "stage/**", "chore/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline-x86:
    uses: ./.github/workflows/arch-pipeline.yml
    with:
      arch: x86

  pipeline-x64:
    uses: ./.github/workflows/arch-pipeline.yml
    with:
      arch: x64

  # if: always() runs the gate even when its pipeline failed or was skipped;
  # a skipped required check counts as passing, so the gate must fail
  # explicitly on anything but success. See docs/ci-pipeline.md.
  gate-x86:
    name: build + test (x86)
    needs: pipeline-x86
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful pipeline
        shell: bash
        env:
          PIPELINE_RESULT: ${{ needs.pipeline-x86.result }}
        run: |
          if [ "$PIPELINE_RESULT" != "success" ]; then
            echo "::error::pipeline-x86 finished with result '$PIPELINE_RESULT', expected 'success'"
            exit 1
          fi

  gate-x64:
    name: build + test (x64)
    needs: pipeline-x64
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful pipeline
        shell: bash
        env:
          PIPELINE_RESULT: ${{ needs.pipeline-x64.result }}
        run: |
          if [ "$PIPELINE_RESULT" != "success" ]; then
            echo "::error::pipeline-x64 finished with result '$PIPELINE_RESULT', expected 'success'"
            exit 1
          fi

  # Not a gate and not a required check: no gate waits for it. See
  # docs/ci-pipeline.md.
  export-table:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/export-table
